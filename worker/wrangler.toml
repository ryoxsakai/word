name = "vocab-app"
main = "src/index.js"
compatibility_date = "2024-11-01"
# vocab.lrnr.jp/mcp* is managed in the Cloudflare dashboard.
workers_dev = false
# Preserve Cloudflare Access settings added in the dashboard for /mcp-write.
keep_vars = true

[assets]
directory = "../public"
binding = "ASSETS"

[vars]
# GitHub PagesなどAPIと別オリジンからアクセスするフロントエンドのURLをカンマ区切りで指定。
# 例: "https://ryoxsakai.github.io"
ALLOWED_ORIGINS = "https://ryoxsakai.github.io,https://vocab.lrnr.jp"

[[d1_databases]]
binding = "DB"
database_name = "vocab-db"
database_id = "5bb1bc51-a169-4686-bc34-97e181d536f6"
