name = "vocab-app"
main = "src/coverage-entry.js"
compatibility_date = "2024-11-01"
# The dashboard routes only /mcp*, /oauth/*, and /.well-known/oauth-* to this Worker.
# The rest of vocab.lrnr.jp remains on GitHub Pages.
workers_dev = false
# Preserve dashboard-managed VOCAB_MCP_API_KEY and VOCAB_MCP_SESSION_SECRET.
keep_vars = true

[assets]
directory = "../public"
binding = "ASSETS"

[vars]
# 一時的に /mcp と /mcp-write の編集・監査ツールを認証なしで公開する。再保護時は "false" に変更する。
MCP_ALLOW_ANONYMOUS_WRITES = "true"
# GitHub PagesなどAPIと別オリジンからアクセスするフロントエンドのURLをカンマ区切りで指定。
# 例: "https://ryoxsakai.github.io"
ALLOWED_ORIGINS = "https://ryoxsakai.github.io,https://vocab.lrnr.jp"
# ElevenLabsのAPIキーはWorker Secretとして別途設定する。
# 音声・モデルはダッシュボード側の変数で上書きできる。
ELEVENLABS_VOICE_ID = "Sq93GQT4X1lKDXsQcixO"
ELEVENLABS_MODEL_ID = "eleven_multilingual_v2"
# 毎分この件数まで、発音記号登録済みで音声がない見出し語を自動生成する。
AUDIO_AUTO_BATCH_SIZE = "5"
AUDIO_AUTO_ENABLED = "true"
# Images run only for explicitly queued words; the API key must be set as a Worker Secret.
ILLUSTRATIONS_ENABLED = "false"
ILLUSTRATION_MODEL = "gpt-image-2"
ILLUSTRATION_QUALITY = "medium"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vocab-db"
database_id = "5bb1bc51-a169-4686-bc34-97e181d536f6"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "vocab-audio"

[[r2_buckets]]
binding = "ILLUSTRATION_BUCKET"
bucket_name = "vocab-illustrations"
