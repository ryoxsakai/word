name: Viewer regeneration checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'public/setting/**'
      - 'public/viewer/static-chapter.js'
      - '.github/workflows/viewer-regeneration-checks.yml'
permissions:
  contents: read
jobs:
  regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:regeneration && npm run test:snapshots && npm run test:editor-table
