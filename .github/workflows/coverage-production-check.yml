name: Coverage API production check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/coverage-production-check.yml"
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live coverage JSON
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://vocab.lrnr.jp/mcp-viewer/api/lists/crossover-v3/coverage/uncovered?mode=practical&view=unique&limit=1"
          curl -fsS "$endpoint" \
            --retry 6 --retry-delay 10 --retry-all-errors \
            -o /tmp/coverage.json

          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("/tmp/coverage.json", "utf8"));
          const expectedBooks = ["target1900", "teppeki", "systan", "passtan_p1"];

          if (report.schemaVersion !== 1) throw new Error("Unexpected schemaVersion");
          if (report.notebook?.id !== "crossover-v3") throw new Error("Unexpected notebook id");
          if (!Array.isArray(report.words) || report.words.length > 1) throw new Error("Unexpected words page");
          if (!Array.isArray(report.summary?.books)) throw new Error("Missing book summaries");

          const summaries = new Map(report.summary.books.map((book) => [book.key, book]));
          for (const key of expectedBooks) {
            const book = summaries.get(key);
            if (!book) throw new Error(`Missing summary for ${key}`);
            if (!Number.isInteger(book.total) || book.total < 100 || book.total > 4000) {
              throw new Error(`Implausible source total for ${key}: ${book.total}`);
            }
            if (book.practicalCovered + book.practicalUncovered !== book.total) {
              throw new Error(`Inconsistent practical counts for ${key}`);
            }
            if (book.exactCovered + book.exactUncovered !== book.total) {
              throw new Error(`Inconsistent exact counts for ${key}`);
            }
          }

          console.log(JSON.stringify({
            notebook: report.notebook,
            request: report.request,
            summary: report.summary,
            pagination: report.pagination,
            firstWord: report.words[0] || null,
          }, null, 2));
          NODE
