name: Deploy Cloudflare Worker

on:
  # main への push で自動デプロイする。worker/ 配下 or このファイル自体の変更が対象。
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:
    inputs:
      bootstrap_d1:
        description: "初回のみtrue: D1データベースを新規作成しスキーマを適用してからデプロイする"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Test MCP read and authenticated write tools
        run: npm run test:mcp-write

      - name: Create D1 database if it doesn't exist yet (bootstrap only)
        if: ${{ inputs.bootstrap_d1 == true }}
        run: |
          npx wrangler d1 create vocab-db || echo "vocab-db already exists (or create failed) — continuing, assuming wrangler.toml already has the correct database_id"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply vocab-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify MCP Streamable HTTP endpoint
        run: |
          curl -sf -X POST "https://vocab.lrnr.jp/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions","version":"1.0.0"}}}' \
            --retry 5 --retry-delay 10 --retry-all-errors \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const p=JSON.parse(s);if(p.result?.serverInfo?.name!=="vocab")process.exit(1)})'

          curl -sf -X POST "https://vocab.lrnr.jp/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            --retry 5 --retry-delay 10 --retry-all-errors \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const p=JSON.parse(s);const tools=p.result?.tools||[];if(!tools.some(t=>t.name==="vocab.list_notebooks")||tools.some(t=>t.name==="create_notebook"||t.name==="vocab.create_notebook"))process.exit(1)})'

          write_status=$(curl -sS -o /tmp/vocab-mcp-write.json -w "%{http_code}" -X POST "https://vocab.lrnr.jp/mcp-write" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"create_notebook","arguments":{"name":"unauthorized-deploy-check"}}}' \
            --retry 5 --retry-delay 10 --retry-all-errors)

          if [ "$write_status" = "200" ]; then
            node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/vocab-mcp-write.json","utf8"));if(p.result?.isError!==true)process.exit(1)'
          elif [ "$write_status" != "401" ] && [ "$write_status" != "403" ]; then
            cat /tmp/vocab-mcp-write.json
            exit 1
          fi
