name: Deploy Cloudflare Worker

on:
  # main への push で自動デプロイする。worker/ 配下 or このファイル自体の変更が対象。
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:
    inputs:
      bootstrap_d1:
        description: "初回のみtrue: D1データベースを新規作成しスキーマを適用してからデプロイする"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Test MCP OAuth, read, and authenticated write tools
        run: npm run test:mcp-write

      - name: Create D1 database if it doesn't exist yet (bootstrap only)
        if: ${{ inputs.bootstrap_d1 == true }}
        run: |
          npx wrangler d1 create vocab-db || echo "vocab-db already exists (or create failed) — continuing, assuming wrangler.toml already has the correct database_id"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply vocab-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify MCP Streamable HTTP endpoint
        run: |
          # Workerの新バージョンが既存Routeへ伝播する前に旧版へ当たることがある。
          sleep 15

          # The GitHub Pages viewer uses a GET-only API under the existing /mcp* route.
          curl -sf "https://vocab.lrnr.jp/mcp-viewer/api/lists" \
            --retry 5 --retry-delay 10 --retry-all-errors \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const p=JSON.parse(s);if(!Array.isArray(p))process.exit(1)})'

          viewer_write_status="$(curl -s -o /tmp/vocab-viewer-write.json -w "%{http_code}" \
            -X POST "https://vocab.lrnr.jp/mcp-viewer/api/lists" \
            -H "Content-Type: application/json" \
            --data '{"name":"must-not-be-created"}')"
          test "$viewer_write_status" = "405"

          # The editor API must never be usable without an OAuth bearer token.
          editor_unauthorized_status="$(curl -s -o /tmp/vocab-editor-unauthorized.json -w "%{http_code}" \
            "https://vocab.lrnr.jp/mcp-editor/api/lists")"
          test "$editor_unauthorized_status" = "401"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/vocab-editor-unauthorized.json","utf8"));if(p.error!=="invalid_token")process.exit(1)'

          curl -sf -X POST "https://vocab.lrnr.jp/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions","version":"1.0.0"}}}' \
            --retry 5 --retry-delay 10 --retry-all-errors \
            | tee /tmp/vocab-mcp-initialize.json \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const p=JSON.parse(s);if(p.result?.serverInfo?.name!=="vocab")process.exit(1)})'

          curl -sf -X POST "https://vocab.lrnr.jp/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            --retry 5 --retry-delay 10 --retry-all-errors \
            | tee /tmp/vocab-mcp-tools.json \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const p=JSON.parse(s);const tools=p.result?.tools||[];const read=tools.find(t=>t.name==="list_notebooks");const write=tools.find(t=>t.name==="update_word");if(!read||read.securitySchemes?.[0]?.type!=="noauth"||!write||write.securitySchemes?.[0]?.type!=="oauth2"||!tools.some(t=>t.name==="vocab.create_notebook"))process.exit(1)})'

          curl -sf "https://vocab.lrnr.jp/.well-known/oauth-protected-resource/mcp" \
            --retry 5 --retry-delay 10 --retry-all-errors \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const p=JSON.parse(s);if(p.resource!=="https://vocab.lrnr.jp/mcp"||!p.scopes_supported?.includes("vocab:write"))process.exit(1)})'

          curl -sf "https://vocab.lrnr.jp/.well-known/oauth-protected-resource/mcp-write" \
            --retry 5 --retry-delay 10 --retry-all-errors \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const p=JSON.parse(s);if(p.resource!=="https://vocab.lrnr.jp/mcp-write"||!p.scopes_supported?.includes("vocab:write"))process.exit(1)})'

          curl -sf "https://vocab.lrnr.jp/.well-known/oauth-authorization-server" \
            --retry 5 --retry-delay 10 --retry-all-errors \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const p=JSON.parse(s);if(p.authorization_endpoint!=="https://vocab.lrnr.jp/oauth/authorize"||p.token_endpoint!=="https://vocab.lrnr.jp/oauth/token"||p.registration_endpoint!=="https://vocab.lrnr.jp/oauth/register"||!p.code_challenge_methods_supported?.includes("S256"))process.exit(1)})'

          write_status=$(curl -sS -o /tmp/vocab-mcp-write.json -w "%{http_code}" -X POST "https://vocab.lrnr.jp/mcp-write" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"create_notebook","arguments":{"name":"unauthorized-deploy-check"}}}' \
            --retry 5 --retry-delay 10 --retry-all-errors)

          if [ "$write_status" != "401" ]; then
            cat /tmp/vocab-mcp-write.json
            exit 1
          fi

          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/vocab-mcp-write.json","utf8"));if(p.error!=="invalid_token")process.exit(1)'

          combined_write_status=$(curl -sS -o /tmp/vocab-mcp-combined-write.json -w "%{http_code}" -X POST "https://vocab.lrnr.jp/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"update_word","arguments":{"lookup_spelling":"must-not-be-updated","notes":"unauthorized-deploy-check"}}}' \
            --retry 5 --retry-delay 10 --retry-all-errors)

          if [ "$combined_write_status" != "401" ]; then
            cat /tmp/vocab-mcp-combined-write.json
            exit 1
          fi

          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/vocab-mcp-combined-write.json","utf8"));if(p.error!=="invalid_token")process.exit(1)'
