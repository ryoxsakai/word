name: Coverage API and MCP checks

on:
  pull_request:
    paths:
      - "worker/src/coverage.js"
      - "worker/src/coverage-entry.js"
      - "worker/src/coverage-mcp.js"
      - "worker/test/coverage.test.mjs"
      - "worker/test/coverage-mcp.test.mjs"
      - "worker/package.json"
      - "worker/package-lock.json"
      - "worker/wrangler.toml"
      - ".github/workflows/coverage-api-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:coverage
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/vocab-worker
