name: Editor authentication checks
on:
  pull_request:
    paths:
      - 'public/setting/auth.js'
      - 'worker/test/editor-auth.test.mjs'
      - '.github/workflows/editor-auth-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node worker/test/editor-auth.test.mjs
