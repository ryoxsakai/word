name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test WebMCP tools
        run: node .github/tests/webmcp.integration.mjs
      - name: Test lazy viewer navigation
        run: node .github/tests/viewer-navigation.integration.mjs
      - name: Test alphabetical word index
        run: node .github/tests/word-index.integration.mjs
      - name: Prepare cache-safe Pages artifact
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          cp -R public pages-dist
          node .github/scripts/version-pages-assets.mjs pages-dist "$ASSET_VERSION"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
