name: Illustration checks
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'public/setting/illustrations*'
      - 'public/shared/illustrations.js'
      - 'public/shared/illustration-references/**'
      - 'public/viewer/**'
      - '.github/workflows/illustration-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:illustrations
      - run: npx wrangler deploy --dry-run --outdir /tmp/vocab-illustrations
