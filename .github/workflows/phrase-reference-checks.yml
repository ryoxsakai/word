name: Phrase reference checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/shared/**'
      - 'public/setting/**'
      - 'public/viewer/**'
      - '.github/tests/phrase-references*'
      - '.github/workflows/phrase-reference-checks.yml'
      - 'worker/test/editor-table.integration.mjs'
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/tests/markup.integration.mjs && node .github/tests/phrase-references.integration.mjs && node .github/tests/idiom-viewer.integration.mjs
      - run: npm ci
        working-directory: worker
      - run: npm run test:editor-table
        working-directory: worker
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node .github/tests/phrase-references.browser.mjs
