name: Temporary define family check

on:
  push:
    branches:
      - codex/coverage-mcp-tool
    paths:
      - .github/workflows/tmp-define-family-check.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live crossover records
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import urllib.request

          full_url = 'https://vocab.lrnr.jp/mcp-viewer/api/lists/crossover-v3/words/full'
          coverage_url = 'https://vocab.lrnr.jp/mcp-viewer/api/lists/crossover-v3/coverage/uncovered?books=systan&mode=practical&view=unique&limit=5000'

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'define-family-check'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          full = fetch(full_url)
          coverage = fetch(coverage_url)

          records = full.get('words', full) if isinstance(full, dict) else full
          targets = {'define', 'definite', 'definitely'}
          crossover_matches = [
              record for record in records
              if str(record.get('spelling', '')).lower() in targets
              or str(record.get('id', '')).lower() in targets
          ]
          uncovered_matches = [
              record for record in coverage.get('words', [])
              if str(record.get('spelling', '')).lower() in targets
          ]

          result = {
              'crossoverMatches': crossover_matches,
              'uncoveredMatches': uncovered_matches,
              'crossoverRecordCount': len(records),
          }
          with open('define-family-live.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: define-family-live
          path: define-family-live.json
          if-no-files-found: error
          retention-days: 1
