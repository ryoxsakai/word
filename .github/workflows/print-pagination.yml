name: Test print pagination
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/viewer/**'
      - '.github/tests/print-pagination.browser.mjs'
      - '.github/workflows/print-pagination.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  print-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.63.0 pagedjs@0.4.3
      - run: npx playwright install --with-deps chromium
      - run: node .github/tests/print-pagination.browser.mjs
