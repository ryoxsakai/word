<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f8f9fc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)" />
<title>crossover 編集</title>
<!-- 最初の描画の前にテーマを決める（読み込み中も、選んだテーマで表示する）。 -->
<script>try { const t = localStorage.getItem("vocab-viewer-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon-setting.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,700;1,400&family=M+PLUS+2:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="../shared/fonts/charis-sil.css" />
<link rel="stylesheet" href="../viewer/style.css" />
<link rel="stylesheet" href="./edit/edit.css" />
</head>
<body class="is-viewer-edit">
<header class="topbar">
  <div class="topbar-row topbar-row--primary">
    <h1 class="brand-name">crossover <span class="edit-brand-badge">編集</span></h1>
    <span id="publishStatus" class="edit-publish-status" role="status" aria-live="polite" hidden></span>
    <button type="button" class="icon-toggle settings-toggle" id="settingsToggle" aria-expanded="false" aria-controls="settingsMenu" aria-label="設定を開く">
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
    </button>
    <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="contentsMenu" aria-label="目次を開く">
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
    </button>
  </div>
  <div class="topbar-row topbar-row--secondary" id="settingsMenu">
    <form id="searchForm" class="search-row" role="search">
      <input id="searchInput" type="search" placeholder="スペル・熟語・本文で検索" autocomplete="off" />
    </form>
    <form id="jumpForm" class="jump-row">
      <label for="jumpInput">no.</label>
      <input id="jumpInput" type="text" inputmode="numeric" placeholder="42" />
      <button type="submit">ジャンプ</button>
    </form>
    <div class="fontsize-row">
      <span class="fontsize-label">文字サイズ</span>
      <div class="fontsize-steps" id="fontSizeSteps" role="group" aria-label="文字サイズ（5段階）">
        <button type="button" class="fontsize-btn" data-font-level="1" aria-label="最小">A</button>
        <button type="button" class="fontsize-btn" data-font-level="2" aria-label="小">A</button>
        <button type="button" class="fontsize-btn" data-font-level="3" aria-label="標準">A</button>
        <button type="button" class="fontsize-btn" data-font-level="4" aria-label="大">A</button>
        <button type="button" class="fontsize-btn" data-font-level="5" aria-label="最大">A</button>
      </div>
    </div>
    <div class="theme-row">
      <span class="theme-label">テーマ</span>
      <button id="themeToggleBtn" type="button" class="chip-toggle" title="ダーク/ライト切り替え">ダーク</button>
    </div>
    <nav class="edit-links" aria-label="ほかの画面">
      <a href="../index.html" target="_blank" rel="noopener"><i class="fa-solid fa-book-open" aria-hidden="true"></i>閲覧ページ</a>
      <a href="./illustrations.html"><i class="fa-solid fa-image" aria-hidden="true"></i>イラスト管理</a>
      <a href="./classic.html"><i class="fa-solid fa-table" aria-hidden="true"></i>旧編集画面（音声生成・マスター一覧・単語帳管理）</a>
    </nav>
    <p class="edit-help">単語の番号をダブルタップすると編集モードになります。文字をダブルタップすると、その欄を直接編集できます。単語は編集後に「保存」を押してください。「リセット」でその単語の未保存の変更を取り消せます。</p>
  </div>
  <div class="topbar-row topbar-row--contents" id="contentsMenu">
    <div class="contents-menu-heading contents-menu-heading--sections">目次 <small>（単語タブでは、つまみを長押しして並べ替え）</small></div>
    <nav id="contentsNav" class="contents-nav edit-contents-nav" aria-label="チャプター・セクション一覧"></nav>
  </div>
</header>
<div class="subbar">
  <div class="view-tabs" role="tablist" aria-label="表示切り替え">
    <button type="button" class="view-tab" id="viewTabList" role="tab" aria-selected="true" aria-controls="wordList" data-view="list">単語</button>
    <button type="button" class="view-tab" id="viewTabIdioms" role="tab" aria-selected="false" aria-controls="idiomList" tabindex="-1" data-view="idioms">熟語</button>
    <button type="button" class="view-tab" id="viewTabIndex" role="tab" aria-selected="false" aria-controls="indexList" tabindex="-1" data-view="index">索引</button>
  </div>
</div>
<main id="wordList" class="word-list view-panel is-active edit-root" data-view-panel="list" role="tabpanel" aria-labelledby="viewTabList"></main>
<section id="idiomList" class="word-list idiom-list view-panel edit-root" data-view-panel="idioms" role="tabpanel" aria-labelledby="viewTabIdioms" aria-hidden="true"></section>
<div id="indexList" class="index-list view-panel" data-view-panel="index" role="tabpanel" aria-labelledby="viewTabIndex" aria-hidden="true"></div>
<nav id="sectionNav" class="section-nav" hidden></nav>
<script type="module" src="./edit/main.js"></script>
</body>
</html>
