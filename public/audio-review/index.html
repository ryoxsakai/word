<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>発音音声サンプル</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>発音音声サンプル</h1>
    <p>生成条件による発音・イントネーションの違いを比較できます。</p>
    <section>
      <h2>音量比較：turn</h2>
      <div class="buttons" data-url="/mcp-viewer/api/audio/turn/primary">
        <button data-gain="1">現状</button>
        <button data-gain="1.25">少し大きい（+約2 dB）</button>
        <button data-gain="1.4">大きい（+約3 dB）</button>
      </div>
    </section>
    <section>
      <h2>transfer：生成方法比較</h2>
      <div class="sample"><span>現在の主音声（辞書なし）</span><button data-url="/mcp-viewer/api/audio/transfer/primary" data-gain="1.4">再生</button></div>
      <div class="sample"><span>以前の辞書なしサンプル</span><button data-url="/mcp-viewer/api/audio/transfer/sample-native" data-gain="1.4">再生</button></div>
      <div class="sample"><span>動詞文脈あり（文脈自体は無音）</span><button data-url="/mcp-viewer/api/audio/transfer/sample-context" data-gain="1.4">再生</button></div>
    </section>
    <section>
      <h2>ピリオドによるイントネーション比較</h2>
      <div class="sample"><span>come（現在の主音声）</span><button data-url="/mcp-viewer/api/audio/come/primary" data-gain="1.4">再生</button></div>
      <div class="sample"><span>Come.</span><button data-url="/mcp-viewer/api/audio/come/sample-period" data-gain="1.4">再生</button></div>
      <div class="sample"><span>respectable（現在の主音声）</span><button data-url="/mcp-viewer/api/audio/respectable/primary" data-gain="1.4">再生</button></div>
      <div class="sample"><span>Respectable.</span><button data-url="/mcp-viewer/api/audio/respectable/sample-period" data-gain="1.4">再生</button></div>
    </section>
    <p id="status" role="status"></p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
